name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containerized-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run containerized checks
        run: |
          mkdir -p logs
          ./scripts/ci.sh > logs/ci.log 2>&1

      - name: Print concise CI summary
        if: always()
        run: |
          grep -E "100-person|audience-100|API and WebSocket smoke test passed|test result:|Tasks:|ERROR|error TS|error:|failed|Failed" logs/ci.log | tail -200 || true

      - name: Upload containerized CI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/ci.log
          retention-days: 14
          if-no-files-found: error
