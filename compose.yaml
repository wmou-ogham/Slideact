name: slide-helper

x-rust-service: &rust-service
  image: slide-helper-rust:dev
  build:
    context: .
    dockerfile: infra/docker/rust.Dockerfile
  environment: &rust-environment
    DATABASE_URL: postgres://slide_helper:slide_helper_dev_only@postgres:5432/slide_helper
    REDIS_URL: redis://redis:6379/
    RUST_LOG: ${RUST_LOG:-slide_helper_api=info,slide_helper_worker=info,tower_http=info}
  init: true
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slide_helper}
      POSTGRES_USER: ${POSTGRES_USER:-slide_helper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slide_helper_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - redis-data:/data

  migrate:
    <<: *rust-service
    command: ["/usr/local/bin/slide-helper-api", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *rust-service
    environment:
      <<: *rust-environment
      APP_BIND: 0.0.0.0:8080
    command: ["/usr/local/bin/slide-helper-api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "8080:8080"

  worker:
    <<: *rust-service
    environment:
      <<: *rust-environment
      WORKER_BIND: 0.0.0.0:8081
    command: ["/usr/local/bin/slide-helper-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
