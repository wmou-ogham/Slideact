<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide Helper</title>

      <header>
        <span class="mark">S</span>
        <div>

      <button id="mode-button" type="button"></button>
      <p id="hint"></p>

    <script type="module" src="./main.ts"></script>
