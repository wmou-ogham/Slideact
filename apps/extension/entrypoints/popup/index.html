<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slideact</title>
  </head>
  <body>
    <main>
      <header>
        <span class="mark">S</span>
        <div>
          <strong>Slideact</strong>
          <small id="subtitle"></small>
        </div>
      </header>
      <section class="status-card">
        <span class="status-dot" aria-hidden="true"></span>
        <div>
          <small id="mode-label"></small>
          <strong id="position-label"></strong>
        </div>
      </section>
      <form id="pair-form">
        <label for="server-url" id="server-label"></label>
        <input id="server-url" type="url" required />
        <label for="pair-code" id="pair-label"></label>
        <input id="pair-code" maxlength="8" autocomplete="one-time-code" required />
        <button id="pair-button" type="submit"></button>
      </form>
      <button id="mode-button" type="button"></button>
      <p id="hint"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
